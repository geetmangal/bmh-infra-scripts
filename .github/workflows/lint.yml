name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S style proxmox/pve-snapshot-rotate.sh kvm/cloud-init-vm.sh
          bash -n proxmox/pve-snapshot-rotate.sh kvm/cloud-init-vm.sh
      - name: help paths
        run: |
          proxmox/pve-snapshot-rotate.sh --help >/dev/null
          kvm/cloud-init-vm.sh --help >/dev/null

  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: pip install ruff
      - name: ruff
        run: ruff check bgp/anycast-healthcheck.py vmware/vcenter-snapshot-report.py tests
      - name: compile
        run: python -m py_compile bgp/anycast-healthcheck.py vmware/vcenter-snapshot-report.py
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: smoke
        run: |
          python bgp/anycast-healthcheck.py --help >/dev/null
          python vmware/vcenter-snapshot-report.py --help >/dev/null
          printf 'prefix: 203.0.113.1/32\nfail_threshold: 1\nstate_file: ""\nchecks:\n  - name: dead\n    type: tcp\n    port: 1\n    timeout: 0.5\n' > /tmp/hc.yaml
          python bgp/anycast-healthcheck.py -c /tmp/hc.yaml --check-once --json --backend exec --exec-up true --exec-down true || test $? -eq 1
